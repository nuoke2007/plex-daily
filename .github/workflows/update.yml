name: daily-update

on:
  schedule:
    - cron: '0 1 * * *'      # 北京时 09:00
    - cron: '30 12 * * *'    # 北京时 20:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install deps
        run: pip install openpyxl
      - name: run daily
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python scripts/run_daily.py
      - name: commit dashboard
        run: |
          git config user.name "plex-bot"
          git config user.email "plex-bot@users.noreply.github.com"
          git add dashboard.html leads.xlsx logs/
          git commit -m "daily update" || echo "nothing to commit"
          git push
      - name: deploy pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          exclude_assets: ".git,scripts,data,logs,.github"
